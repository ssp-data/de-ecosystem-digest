  cache_keys:
    key: xorq_cache-snapshot-17e7fb9aed84ee6df2b00ffb2a9470bb
    relative_path: parquet
  sql_queries:
    - - main
      - xorq_datafusion
      - |-
        SELECT
          *
        FROM (
          SELECT
            "t1"."week",
            COUNT("t1"."id") AS "mentions"
          FROM (
            SELECT
              "t1"."id",
              "t1"."published_date",
              "t1"."source_name",
              "t1"."author",
              "t1"."title",
              "t1"."url",
              "t1"."word_count",
              "t1"."_dlt_load_id",
              "t1"."_dlt_id",
              "t1"."week"
            FROM (
              SELECT
                "t0"."id",
                "t0"."published_date",
                "t0"."source_name",
                "t0"."author",
                "t0"."title",
                "t0"."url",
                "t0"."word_count",
                "t0"."_dlt_load_id",
                "t0"."_dlt_id",
                DATE_TRUNC('WEEK', "t0"."published_date") AS "week"
              FROM "articles" AS "t0"
              WHERE
                "t0"."published_date" > ARROW_CAST('2026-07-13 18:31:56.653728', 'Timestamp(Microsecond, None)')
                AND POSITION('dbt' IN LOWER("t0"."title")) > 0
            ) AS "t1"
          ) AS t1
          GROUP BY
            "t1"."week"
        ) AS "t2"
        ORDER BY
          "t2"."week" ASC
