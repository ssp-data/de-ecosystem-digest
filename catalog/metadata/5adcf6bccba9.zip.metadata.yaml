  cache_keys:
    key: xorq_cache-snapshot-3222bbc1c26fbf96bf54a62c36a5e9f2
    relative_path: parquet
  sql_queries:
    - - main
      - xorq_datafusion
      - |-
        SELECT
          *
        FROM (
          SELECT
            "t1"."week",
            COUNT("t1"."id") AS "stars"
          FROM (
            SELECT
              "t1"."id",
              "t1"."created_at",
              "t1"."type",
              "t1"."repo_name",
              "t1"."actor_login",
              "t1"."week"
            FROM (
              SELECT
                "t0"."id",
                "t0"."created_at",
                "t0"."type",
                "t0"."repo_name",
                "t0"."actor_login",
                DATE_TRUNC('WEEK', "t0"."created_at") AS "week"
              FROM "raw_github_events" AS "t0"
              WHERE
                "t0"."repo_name" = 'dbt-labs/dbt-core'
                AND "t0"."type" = 'WatchEvent'
                AND "t0"."created_at" > ARROW_CAST('2026-07-13 18:31:56.605028', 'Timestamp(Microsecond, None)')
            ) AS "t1"
          ) AS t1
          GROUP BY
            "t1"."week"
        ) AS "t2"
        ORDER BY
          "t2"."week" ASC
