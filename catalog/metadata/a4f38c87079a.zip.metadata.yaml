  sql_queries:
    - - main
      - xorq_datafusion
      - |-
        SELECT
          "t0"."date",
          "t0"."downloads",
          "t0"."package"
        FROM "raw_pypi_downloads" AS "t0"
        WHERE
          "t0"."package" = 'dbt-core'
          AND "t0"."category" = 'without_mirrors'
          AND "t0"."date" > DATE_TRUNC('DAY', '2026-05-14')
        ORDER BY
          "t0"."date" ASC
