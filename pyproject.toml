[project]
name = "de-ecosystem-digest-simple"
version = "0.1.0"
description = "A minimal xorq project: DE ecosystem momentum digest, demonstrating the grammar of data"
requires-python = ">=3.13"
dependencies = [
    "xorq[snowflake]>=0.1.0",   # snowflake extra kept in base so `uv run` never prunes the driver
    "dlt[duckdb]>=1.18",
    "feedparser>=6.0",
    "requests>=2.31",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "enlighten>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_ecosystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
